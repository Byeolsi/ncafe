<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- header -->
    <div>
        <div>NCafe</div>
        <div>공유</div>
    </div>
    <!-- main -->
    <div>
        <!-- 메뉴 등록 -->
        <div>메뉴 등록</div>
        <div>
            <div>메뉴 입력 폼</div>
            <div>
                <div>
                    메뉴 이미지 <input type="file">
                </div>
                <div>
                    한글명 <input type="text">
                </div>
                <div>
                    영문명 <input type="text">
                </div>
                <div>
                    카테고리

                        <option>커피</option>
                        <option>티, 차</option>
                        <option>스무디</option>
                        <option>에이드</option>
                    </select>
                </div>
                <div>
                    가격 <input type="text">
                </div>
                <div>
                    설명
                    <textarea col="60" rows="10">
안녕하세요.
또 만났군요.
                    </textarea>
                </div>
                <div>
                    판매가능 <input type="checkbox">
                </div>
                <div>
                    Hot 선택 <input type="checkbox">
                </div>
                <div>
                    Iced 선택 <input type="checkbox">
                </div>
                <div>
                    <button>저장</button>
                    <button>취소</button>
                </div>
            </div>
        </div>
    </div>
    <!-- footer -->
    <div>
        <div>대시보드</div>
        <div>커피목록</div>
        <div>메뉴추가</div>

</html>
